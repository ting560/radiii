<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    
    <!-- Redirecionamento instantâneo via HTML Meta -->
    <meta http-equiv="refresh" content="0;url=https://radiopositivafm.com.br/">
    
    <!-- Redirecionamento via JavaScript (fallback rápido) -->
    <script>
        window.location.href = "https://radiopositivafm.com.br/";
    </script>
</head>
<body>
    <p>Se você não for redirecionado automaticamente, <a href="https://radiopositivafm.com.br/">clique aqui</a>.</p>
</body>
</html>
